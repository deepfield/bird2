# Announcer A — originates a static flow4 route and exports it over EBGP to B,
# setting the redirect next hop (draft-flowspec-redirect-ip-00) + marker EC.
log stderr all;
router id 0.0.0.1;

flow4 table flowtab4;

protocol device { }

protocol static static_flow {
    flow4 { table flowtab4; };
    route flow4 {
        dst 10.0.0.0/24;
    };
}

protocol bgp announcer {
    local 10.1.1.1 as 65001;
    neighbor 10.1.1.2 as 65002;
    flow4 {
        table flowtab4;
        import none;
        export filter {
            bgp_next_hop = 192.0.2.1;
            bgp_ext_community.add((generic, 0x08000000, 0x00000000));
            accept;
        };
    };
}
