# Receiver B — peers with A, imports the flow4 route so A actually sends the UPDATE.
log stderr all;
router id 0.0.0.2;

flow4 table flowtab4;

protocol device { }

protocol bgp receiver {
    local 10.1.1.2 as 65002;
    neighbor 10.1.1.1 as 65001;
    flow4 {
        table flowtab4;
        import all;
        export none;
    };
}
